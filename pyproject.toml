[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-hwpx"
version = "5.0.0"
description = "한글 없이 HWPX 문서를 열고, 편집하고, 생성하고, 검증하는 Python 자동화 라이브러리"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "python-hwpx Maintainers" },
]
keywords = ["hwp", "hwpx", "hancom", "opc", "xml", "document-automation", "validation", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "lxml>=4.9,<7",
]

[project.optional-dependencies]
visual = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
]
# Excel(.xlsx/.xlsm) 명부 ingestion for mail_merge. Lazy-imported; absent => clear error.
xlsx = [
    "openpyxl>=3.1",
]
# Document preview viewer equation rendering: LaTeX -> MathML. Optional; without
# it the preview fails closed to a LaTeX code block instead of dropping equations.
preview = [
    "latex2mathml>=3.77",
]
dev = [
    "build>=1.0",
    "twine>=4.0",
    "pytest>=7.4",
    "latex2mathml>=3.77",
]
test = [
    "build>=1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "latex2mathml>=3.77",
]
typecheck = [
    "mypy>=1.10",
    "pyright>=1.1.390",
]

[project.urls]
Homepage = "https://github.com/airmang/python-hwpx"
Documentation = "https://airmang.github.io/python-hwpx/"
Issues = "https://github.com/airmang/python-hwpx/issues"

[project.scripts]
# The `hwpx` agent CLI moved to hwpx-mcp-server, which declares the name in the
# train that raises its core floor to 5.0 — so no valid install ever has two
# declarers of it. `hwpx-conformance` is gone too: its package is repository QA
# and no longer ships, and a console script pointing into an excluded package
# would install as a command that cannot start.
hwpx-unpack = "hwpx.tools.archive_cli:unpack_main"
hwpx-pack = "hwpx.tools.archive_cli:pack_main"
hwpx-validate = "hwpx.tools.validator:main"
hwpx-validate-package = "hwpx.tools.package_validator:main"
hwpx-page-guard = "hwpx.tools.page_guard:main"
hwpx-analyze-template = "hwpx.tools.template_analyzer:main"
hwpx-text-extract = "hwpx.tools.text_extract_cli:main"
hwpx-repair = "hwpx.tools.repair:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["hwpx*"]
# Repository QA assets, not library surface. They live under src/ so the suite can
# import them without path games, and are excluded here so they do not ship: a fuzz
# harness, a conformance campaign runner, and a blind-evaluation benchmark are
# things this project runs on itself, not things a library user installs.
exclude = ["hwpx.benchmark*", "hwpx.conformance*"]

[tool.setuptools.package-data]
"hwpx" = ["py.typed"]
"hwpx.tools" = ["_schemas/*.xsd"]
"hwpx.data" = ["Skeleton.hwpx"]
"hwpx.visual" = ["_render_hwpx.ps1", "_render_hwpx_mac.applescript", "_refresh_hwpx_mac.applescript", "_hancom_open_rate.ps1"]
"hwpx.design" = [
    "profiles/*/profile.json",
    "profiles/*/template.hwpx",
    "profiles/*/fragments/*.xml",
]
"hwpx.conformance" = [
    "corpus/corpus.json",
    "corpus/*.hwpx",
]

[tool.pytest.ini_options]
# scripts/ carries repository QA harnesses that are not library surface — the
# fuzz loop moved there in 5.0 because it needs the MCP owner's builder, and
# core must never import a companion layer.
pythonpath = ["src", "scripts"]
addopts = "-ra"
testpaths = ["tests"]


[tool.mypy]
python_version = "3.10"
# Explicit gradual-migration allowlist: transitive imports enter the gate only
# after they are added here and made clean themselves.
follow_imports = "skip"
files = [
    "src/hwpx/document.py",
    "src/hwpx/errors.py",
    "src/hwpx/mutation_report.py",
    "src/hwpx/equation/__init__.py",
    "src/hwpx/equation/tokens.py",
    "src/hwpx/equation/eqedit.py",
    "src/hwpx/equation/mathml.py",
    "src/hwpx/equation/render.py",
    "src/hwpx/tools/document_viewer.py",
    "src/hwpx/tools/mail_merge.py",
    "src/hwpx/tools/redline.py",
    "src/hwpx/_document/_units.py",
    "src/hwpx/_document/fields.py",
    "src/hwpx/_document/layout.py",
    "src/hwpx/_document/media.py",
    "src/hwpx/_document/memos.py",
    "src/hwpx/_document/persistence.py",
    "src/hwpx/_document/shapes.py",
    "src/hwpx/_document/tracked.py",
    "src/hwpx/oxml/_document_impl.py",
    "src/hwpx/oxml/_document_primitives.py",
    "src/hwpx/oxml/document.py",
    "src/hwpx/oxml/document_parts.py",
    "src/hwpx/oxml/header_part.py",
    "src/hwpx/oxml/memo.py",
    "src/hwpx/oxml/numbering.py",
    "src/hwpx/oxml/objects.py",
    "src/hwpx/opc/package.py",
    "src/hwpx/opc/relationships.py",
    "src/hwpx/oxml/paragraph.py",
    "src/hwpx/oxml/run.py",
    "src/hwpx/oxml/section.py",
    "src/hwpx/oxml/section_format.py",
    "src/hwpx/oxml/section_story.py",
    "src/hwpx/oxml/simple_parts.py",
    "src/hwpx/oxml/table.py",
    "src/hwpx/quality/policy.py",
    "src/hwpx/quality/rendering.py",
    "src/hwpx/quality/report.py",
    "src/hwpx/tools/archive_cli.py",
    "src/hwpx/tools/package_validator.py",
    "src/hwpx/tools/page_guard.py",
    "src/hwpx/tools/template_analyzer.py",
    "src/hwpx/tools/text_extract_cli.py",
    "src/hwpx/tools/text_extractor.py",
    "src/hwpx/visual/oracle.py",
    "tests/template_automation/helpers.py",
    "tests/template_automation/generate_fixtures.py",
]
ignore_missing_imports = true

[tool.pyright]
# Keep basic pyright focused on the explicit gradual scope. Feature 025 adds
# both central facades and every extracted/touched runtime owner to the gate.
include = [
    "src/hwpx/document.py",
    "src/hwpx/errors.py",
    "src/hwpx/mutation_report.py",
    "src/hwpx/equation/__init__.py",
    "src/hwpx/equation/tokens.py",
    "src/hwpx/equation/eqedit.py",
    "src/hwpx/equation/mathml.py",
    "src/hwpx/equation/render.py",
    "src/hwpx/tools/document_viewer.py",
    "src/hwpx/tools/mail_merge.py",
    "src/hwpx/tools/redline.py",
    "src/hwpx/_document/_units.py",
    "src/hwpx/_document/fields.py",
    "src/hwpx/_document/layout.py",
    "src/hwpx/_document/media.py",
    "src/hwpx/_document/memos.py",
    "src/hwpx/_document/persistence.py",
    "src/hwpx/_document/shapes.py",
    "src/hwpx/_document/tracked.py",
    "src/hwpx/oxml/_document_impl.py",
    "src/hwpx/oxml/_document_primitives.py",
    "src/hwpx/oxml/document.py",
    "src/hwpx/oxml/document_parts.py",
    "src/hwpx/oxml/header_part.py",
    "src/hwpx/oxml/memo.py",
    "src/hwpx/oxml/numbering.py",
    "src/hwpx/oxml/objects.py",
    "src/hwpx/opc/package.py",
    "src/hwpx/opc/relationships.py",
    "src/hwpx/oxml/paragraph.py",
    "src/hwpx/oxml/run.py",
    "src/hwpx/oxml/section.py",
    "src/hwpx/oxml/section_format.py",
    "src/hwpx/oxml/section_story.py",
    "src/hwpx/oxml/simple_parts.py",
    "src/hwpx/oxml/table.py",
    "src/hwpx/quality/policy.py",
    "src/hwpx/quality/rendering.py",
    "src/hwpx/quality/report.py",
    "src/hwpx/tools/archive_cli.py",
    "src/hwpx/tools/package_validator.py",
    "src/hwpx/tools/page_guard.py",
    "src/hwpx/tools/template_analyzer.py",
    "src/hwpx/tools/text_extract_cli.py",
    "src/hwpx/tools/text_extractor.py",
    "src/hwpx/visual/oracle.py",
    "tests/template_automation/helpers.py",
    "tests/template_automation/generate_fixtures.py",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
