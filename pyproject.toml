    "src/hwpx/oxml/header_compat.py",
    # 6.9 (train 33): document insertion/merge — born in the gate, per the
    # WP-A rule above.
    "src/hwpx/tools/document_merge.py",
    # 6.9 (train 34): dutmal/compose authoring — born in the gate, per the
